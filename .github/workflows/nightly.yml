name: Nightly Stargazing Check

on:
  schedule:
    - cron: '55 0 * * *'  # 5:55pm PDT (UTC-7), ~65min before CCR reads result
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -q
      - name: Run stargazing check
        run: python sf_stargazing.py > latest_result.txt 2>&1 || true
      - name: Publish result to results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan results-tmp
          git reset
          git add latest_result.txt
          git commit -m "latest"
          git push origin results-tmp:results --force

